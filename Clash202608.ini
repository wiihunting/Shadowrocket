[custom]
# 不要随意改变关键字，否则会导致出错

# 基础规则
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

# 广告拦截规则
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=REJECT,https://gist.githubusercontent.com/wiihunting/0598b81ee702dea7c2ab962f39e1e7f0/raw/Blocked.list

# 国内直连规则
ruleset=DIRECT,https://gist.githubusercontent.com/wiihunting/74cfec7a04f80ac1886ad36764d60858/raw/WeChatClash202503.list
ruleset=DIRECT,https://gist.githubusercontent.com/wiihunting/879786e320467da0b3f9fcf5ab8301c6/raw/viaDirect.list

# Google 和 Apple 规则
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=Apple,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

# AI 服务规则
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list
ruleset=AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Ruleset/ClaudeAI.list
ruleset=AI,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml
ruleset=AI,https://gist.githubusercontent.com/wiihunting/8e7c5c59a79be6edc1340c9e4b768a6f/raw/MoreAiRules.list

# Microsoft 规则
ruleset=Microsoft,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list
ruleset=Microsoft,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list

# 流媒体和社交媒体
ruleset=Twitter,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml
ruleset=Youtube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list

# 其他代理规则
ruleset=自动选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
ruleset=自动选择,https://gist.githubusercontent.com/wiihunting/49a14967571ae56af3728ede99012e00/raw/viaProxy.list
ruleset=OnDemand,https://gist.githubusercontent.com/wiihunting/6aa5527e00f4ec08d71c4ee0b9688587/raw/OnDemand.list
ruleset=Nippon,https://gist.githubusercontent.com/wiihunting/2ddf6b7860dd8daa0f3da9d88b9a5e7f/raw/Nippon.list

# 中国直连规则
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
# ruleset=DIRECT,[]GEOIP,LAN
ruleset=DIRECT,[]GEOIP,CN
ruleset=Final,[]FINAL

# 分组配置
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🔧 手动切换`select`.*
custom_proxy_group=Apple`select`[]DIRECT`[]自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]手动切换
custom_proxy_group=Microsoft`select`[]自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]手动切换`[]DIRECT
custom_proxy_group=Youtube`select`[]自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]手动切换`[]DIRECT
custom_proxy_group=OnDemand`select`[]🇭🇰 香港节点`[]自动选择`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇨🇳 台湾节点`[]手动切换`[]DIRECT
custom_proxy_group=AI`select`[]🇸🇬 狮城节点`[]🇨🇳 台湾节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]自动选择`[]手动切换`[]DIRECT
custom_proxy_group=Twitter`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇭🇰 香港节点`[]自动选择`[]手动切换`[]DIRECT
custom_proxy_group=Nippon`select`[]🇯🇵 日本节点`[]自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]手动切换`[]DIRECT
custom_proxy_group=Final`select`[]自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]手动切换`[]DIRECT

# 节点选择器
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|[^-]日|JP|Japan)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(美|US|United States)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🇨🇳 台湾节点`url-test`(台|TW)`http://www.gstatic.com/generate_204`240,,50

enable_rule_generator=true
overwrite_original_rules=true
